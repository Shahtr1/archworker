server:
  port: 8082

spring:
  datasource:
    url: jdbc:h2:mem:testdb
    driverClassName: org.h2.Driver
    username: sa
    password: ""
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: true

logging:
  org:
    hibernate:
      SQL: DEBUG
      type:
        descriptor:
          sql: TRACE
  level:
    com:
      archworker:
        angulargenerator: DEBUG
  pattern:
    level: "%5p [${spring.application.name},%X{trace_id},%X{span_id}]"

